[versions]
gson = "2.10.1"
jetbrains-annotations = "23.0.0"
lombok = "1.18.44"
sqlite-jdbc = "3.41.2.1"
snakeyaml = "2.2"
spigot-api = "1.16.5-R0.1-SNAPSHOT"
luckperms = "5.4"
bluemap-api = "2.7.7"
minecraft = "1.21.11"
yarn-mappings = "1.21.11+build.4"
fabric-loader = "0.18.4"
fabric-api = "0.141.3+1.21.11"
shadow = "9.3.2"
fabric-loom = "1.15-SNAPSHOT"

[libraries]
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrains-annotations" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
spigot-api = { module = "org.spigotmc:spigot-api", version.ref = "spigot-api" }
luckperms = { module = "net.luckperms:api", version.ref = "luckperms" }
bluemap-api = { module = "de.bluecolored:bluemap-api", version.ref = "bluemap-api" }
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
yarn-mappings = { module = "net.fabricmc:yarn", version.ref = "yarn-mappings" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
fabric-api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric-api" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
fabric-loom = { id = "fabric-loom", version.ref = "fabric-loom" }
