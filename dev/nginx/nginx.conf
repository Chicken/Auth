events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=30s;

    # Authentication
    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass http://127.0.0.1:8000; # Main
            #proxy_pass http://127.0.0.1:7800; # Authorization
            proxy_buffering off;

            auth_request /authentication-outpost/auth;
            error_page 401 = @minecraft_login;

            auth_request_set $minecraft_loggedin $upstream_http_x_minecraft_loggedin;
            auth_request_set $minecraft_uuid     $upstream_http_x_minecraft_uuid;
            auth_request_set $minecraft_username $upstream_http_x_minecraft_username;

            proxy_set_header x-minecraft-loggedin $minecraft_loggedin;
            proxy_set_header x-minecraft-uuid     $minecraft_uuid;
            proxy_set_header x-minecraft-username $minecraft_username;

            proxy_set_header Host $host;
        }

        location /authentication-outpost/ {
            proxy_pass http://paper1:8200/;
            #proxy_pass http://fabric:8200/;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
        }

        location @minecraft_login {
            internal;
            return 302 http://$host:8000/authentication-outpost/login;
        }
    }

    # Authorization
    server {
      listen 127.0.0.1:7800;
      access_log off;

      location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_buffering off;

        auth_request /authorization-outpost/auth;
        error_page 403 = @minecraft_unauthorized;
      }

      location /authorization-outpost/ {
        proxy_pass http://paper1:8300/;
        #proxy_pass http://fabric:8300/;
        proxy_set_header Host $host;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
      }

      location @minecraft_unauthorized {
          internal;
          return 302 http://$host:8000/authorization-outpost/unauthorized;
        }
    }

    # Addons
    server {
        listen 127.0.0.1:8000;
        access_log off;

        location = /settings.json {
            proxy_pass http://paper1:8600;
            #proxy_pass http://fabric:8600;
        }

        location ~ ^/maps/([^/]+_fabric)/live/players.json {
            proxy_pass http://fabric:8500/players/$1;
        }

        location ~ ^/maps/([^/]+_paper2)/live/players.json {
            proxy_pass http://paper2:8500/players/$1;
        }

        location ~ ^/maps/([^/]*)/live/players.json {
            proxy_pass http://paper1:8500/players/$1;
        }

        location ~ ^/addons/chat/([^/]+_fabric)/(.*)$ {
            proxy_pass http://fabric:8800/$2;
            proxy_buffering off;
        }
        location ~ ^/addons/chat/([^/]+_paper2)/(.*)$ {
            proxy_pass http://paper2:8800/$2;
            proxy_buffering off;
        }
        location ~ ^/addons/chat/[^/]+/(.*)$ {
            proxy_pass http://paper1:8800/$1;
            proxy_buffering off;
        }

        # Keep the complete URI: MarkerEditor routes include the map ID.
        location ~ ^/addons/marker-editor/[^/]+_fabric/ {
            proxy_pass http://fabric:8700;
        }
        location ~ ^/addons/marker-editor/[^/]+_paper2/ {
            proxy_pass http://paper2:8700;
        }
        location /addons/marker-editor/ {
            proxy_pass http://paper1:8700;
        }

       location ~ ^/addons/integration/playerhead/([^/]+_fabric)$ {
            proxy_pass http://fabric:8400/playerhead/$1;
            proxy_buffering off;
       }
       location ~ ^/addons/integration/playerhead/([^/]+_paper2)$ {
            proxy_pass http://paper2:8400/playerhead/$1;
            proxy_buffering off;
        }
        location /addons/integration/ {
            proxy_pass http://paper1:8400/;
            proxy_buffering off;
        }

        # private maps
        location /maps/ {
            proxy_pass http://127.0.0.1:7999;
            proxy_buffering off;
        }

        location / {
            proxy_pass http://paper1:8100;
            proxy_buffering off;
        }
    }

    # PrivateMaps
    server {
        listen 127.0.0.1:7999;
        access_log off;

        location / {
            proxy_pass http://paper1:8100;
            auth_request /privatemaps-outpost/auth;
            error_page 403 = @minecraft_unauthorized;
        }

        location /privatemaps-outpost/ {
            proxy_pass http://paper1:8600/;
            #proxy_pass http://fabric:8600/;
            proxy_set_header X-Original-URI $request_uri;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
        }

        location @minecraft_unauthorized {
            internal;
            return 403;
        }
    }
}
